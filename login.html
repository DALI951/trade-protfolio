<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Journal — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="auth-body">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="brand auth-brand">TJ<span class="dot">.</span><span class="brand-sub">BVMT Journal</span></div>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Sign in</button>
                <button class="auth-tab" id="tabRegister">Create account</button>
            </div>
            <form id="authForm" autocomplete="on">
                <label class="auth-label" for="username">Username</label>
                <input class="auth-input" type="text" id="username" name="username" placeholder="your username" autocomplete="username" required>
                <label class="auth-label" for="password">Password</label>
                <input class="auth-input" type="password" id="password" name="password" placeholder="at least 6 characters" autocomplete="current-password" required>
                <div class="auth-error" id="authError"></div>
                <button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Sign in</button>
            </form>
            <div class="auth-note">Your journal data is saved privately on the server, one account per user.</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/common.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script>
        let mode = 'login';

        function setMode(m) {
            mode = m;
            document.getElementById('tabLogin').classList.toggle('active', m === 'login');
            document.getElementById('tabRegister').classList.toggle('active', m === 'register');
            document.getElementById('authSubmit').textContent = m === 'login' ? 'Sign in' : 'Create account';
            document.getElementById('authError').textContent = '';
        }
        document.getElementById('tabLogin').addEventListener('click', () => setMode('login'));
        document.getElementById('tabRegister').addEventListener('click', () => setMode('register'));

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const err = document.getElementById('authError');
            const btn = document.getElementById('authSubmit');
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = mode === 'login' ? 'Signing in...' : 'Creating...';
            const res = mode === 'login' ? await Auth.login(u, p) : await Auth.register(u, p);
            if (res.ok) {
                window.location.replace('index.html');
                return;
            }
            err.textContent = res.error || 'Something went wrong';
            btn.disabled = false;
            btn.textContent = mode === 'login' ? 'Sign in' : 'Create account';
        });

        Auth.status().then((st) => {
            if (st.ok && st.user) window.location.replace('index.html');
        }).catch(() => {});
    </script>
</body>
</html>
